<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziiz1998 - Ramadan Mubarak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d1a;
            --fg: #f5f0e6;
            --muted: #8b9bb4;
            --accent-gold: #d4a853;
            --accent-gold-light: #f0c96e;
            --card: rgba(20, 25, 45, 0.85);
            --border: rgba(212, 168, 83, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .font-display {
            font-family: 'Amiri', serif;
        }

        /* Background Effects */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 10%, rgba(107, 76, 154, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(45, 138, 138, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0a0d1a 0%, #12162a 50%, #0a0d1a 100%);
            z-index: 0;
        }

        .islamic-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30L30 0z' fill='none' stroke='%23d4a853' stroke-width='0.5'/%3E%3C/svg%3E");
            z-index: 0;
        }

        /* Lanterns */
        .lantern {
            position: fixed;
            z-index: 1;
            animation: lanternFloat 6s ease-in-out infinite;
            pointer-events: none;
        }

        .lantern-1 { top: 15%; left: 5%; }
        .lantern-2 { top: 25%; right: 8%; animation-delay: -2s; }
        .lantern-3 { top: 60%; left: 3%; animation-delay: -4s; }

        @keyframes lanternFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }

        .lantern svg {
            width: 45px;
            height: auto;
            filter: drop-shadow(0 0 12px rgba(212, 168, 83, 0.4));
        }

        /* STICKY HEADER - Diposisikan di paling atas */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(10, 13, 26, 0.98) 0%, rgba(10, 13, 26, 0.9) 80%, transparent 100%);
            backdrop-filter: blur(8px);
            padding: 1rem 1.5rem 1.5rem;
            text-align: center;
            width: 100%;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.25rem;
        }

        /* Crescent Moon - Clean Shape */
        .crescent-moon {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
        }

        .crescent-moon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px rgba(212, 168, 83, 0.6));
            animation: crescentGlow 3s ease-in-out infinite alternate;
        }

        @keyframes crescentGlow {
            0% { filter: drop-shadow(0 0 8px rgba(212, 168, 83, 0.5)); }
            100% { filter: drop-shadow(0 0 15px rgba(240, 201, 110, 0.8)); }
        }

        .header-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ramadan-greeting {
            font-size: 0.75rem;
            color: var(--accent-gold);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.9;
            line-height: 1.2;
        }

        .neon-logo {
            font-family: 'Amiri', serif;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--accent-gold-light);
            text-shadow: 
                0 0 10px var(--accent-gold),
                0 0 20px var(--accent-gold);
            animation: goldPulse 3s ease-in-out infinite alternate;
            user-select: none;
            line-height: 1.2;
        }

        @keyframes goldPulse {
            0% { text-shadow: 0 0 10px var(--accent-gold), 0 0 20px var(--accent-gold); }
            100% { text-shadow: 0 0 15px var(--accent-gold-light), 0 0 30px var(--accent-gold); }
        }

        .neon-logo .letter-glow {
            color: #fff;
            text-shadow: 0 0 8px #fff, 0 0 15px var(--accent-gold-light);
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 0.25rem;
            text-align: center;
            width: 100%;
        }

        /* Main Content - Auto Centered */
        .main-content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem 2rem;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            margin-bottom: 2.5rem;
        }

        .plugin-card {
            display: block;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            text-decoration: none;
            color: inherit;
        }

        .plugin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .plugin-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 40px rgba(212, 168, 83, 0.1);
        }

        .plugin-card:hover::before {
            opacity: 1;
        }

        .plugin-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.25rem;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 700;
            transition: transform 0.4s;
            position: relative;
            z-index: 1;
        }

        .plugin-card:hover .plugin-icon {
            transform: scale(1.1);
        }

        .theotown .plugin-icon {
            background: linear-gradient(135deg, #1a3a3a 0%, #2d8a8a 100%);
            box-shadow: 0 8px 30px rgba(45, 138, 138, 0.3);
            color: #f0c96e;
        }

        .hok .plugin-icon {
            background: linear-gradient(135deg, #3a1a1a 0%, #8a4545 100%);
            box-shadow: 0 8px 30px rgba(138, 69, 69, 0.3);
            color: #f0c96e;
        }

        .plugin-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            position: relative;
            z-index: 1;
        }

        .plugin-desc {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }

        .plugin-arrow {
            margin-top: 1.25rem;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s;
            color: var(--accent-gold);
            position: relative;
            z-index: 1;
        }

        .plugin-card:hover .plugin-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .social-section {
            text-align: center;
            width: 100%;
        }

        .social-title {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem 1.25rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--fg);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-btn:hover {
            transform: translateY(-3px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 20px rgba(212, 168, 83, 0.15);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
        }

        .footer {
            position: relative;
            z-index: 10;
            text-align: center;
            color: var(--muted);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            padding: 1.5rem 0;
        }

        .footer span {
            color: var(--accent-gold);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 640px) {
            .lantern { display: none; }
            
            .main-content {
                justify-content: flex-start;
                padding-top: 1rem;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }
            
            .social-links {
                flex-direction: column;
                align-items: stretch;
            }
            
            .social-btn {
                justify-content: center;
            }
        }
    </style>
</head>

    <script>
        // Stars Particle System
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const starCount = 60;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.baseOpacity = Math.random() * 0.4 + 0.2;
            }
            update() { this.twinklePhase += this.twinkleSpeed; }
            draw() {
                const opacity = Math.max(0, Math.min(1, this.baseOpacity + Math.sin(this.twinklePhase) * 0.3));
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(240, 201, 110, ${opacity})`;
                ctx.fill();
            }
        }
        for (let i = 0; i < starCount; i++) stars.push(new Star());
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) animate();
    </script>
