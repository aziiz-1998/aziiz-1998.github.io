<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aziiz1998</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    background: #0f111a;
    color: white;
}

/* PARTICLE CANVAS */
#particles {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 0;
}

/* MAIN CONTENT */
.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    opacity: 0;
    transform: scale(0.95);
    animation: fadeIn 1.2s ease forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 15px;
    text-shadow: 0 0 20px #22b14c;
}

.subtitle {
    color: #aaa;
    margin-bottom: 50px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 40px;
    width: 90%;
    max-width: 900px;
}

.card {
    padding: 70px 30px;
    border-radius: 20px;
    text-decoration: none;
    color: white;
    background: rgba(30,34,48,0.7);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.2s ease, box-shadow 0.4s ease;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    transform-style: preserve-3d;
    perspective: 1000px;
}

.card:hover {
    box-shadow: 0 25px 80px rgba(34,177,76,0.6);
    border-color: #22b14c;
}

.card h2 {
    font-size: 1.6rem;
    margin-bottom: 10px;
}

.card span {
    font-size: 0.9rem;
    color: #ccc;
}

.footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 0.8rem;
    color: #555;
}

@media (max-width: 480px) {
    h1 { font-size: 1.7rem; }
    .card { padding: 50px 20px; }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">
    <h1>🎮 ULTRA GAMING PORTAL</h1>
    <p class="subtitle">Pilih kategori untuk masuk</p>

    <div class="grid">
        <a href="theotown.html" class="card">
            <h2>🏙 Plugin TheoTown</h2>
            <span>Mod & Plugin Eksklusif</span>
        </a>

        <a href="hok.html" class="card">
            <h2>⚔️ Honor of Kings</h2>
            <span>Grup & Komunitas</span>
        </a>
    </div>
</div>

<div class="footer">
    © 2026 Aziiz1998
</div>

<script>
/* ===== PARTICLE SYSTEM WITH CONNECT LINES ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];
const numberOfParticles = 100;

class Particle {
    constructor(){
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = 2;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;

        if(this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if(this.y < 0 || this.y > canvas.height) this.speedY *= -1;
    }
    draw(){
        ctx.fillStyle = "rgba(34,177,76,0.8)";
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

function connect(){
    for(let a=0; a<particlesArray.length; a++){
        for(let b=a; b<particlesArray.length; b++){
            let dx = particlesArray[a].x - particlesArray[b].x;
            let dy = particlesArray[a].y - particlesArray[b].y;
            let distance = dx*dx + dy*dy;
            if(distance < 10000){
                ctx.strokeStyle = "rgba(34,177,76,0.2)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                ctx.stroke();
            }
        }
    }
}

function init(){
    particlesArray = [];
    for(let i=0; i<numberOfParticles; i++){
        particlesArray.push(new Particle());
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particlesArray.forEach(p=>{
        p.update();
        p.draw();
    });
    connect();
    requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
});

/* ===== 3D TILT EFFECT ===== */
const cards = document.querySelectorAll(".card");

cards.forEach(card=>{
    card.addEventListener("mousemove",(e)=>{
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = -(y - centerY) / 15;
        const rotateY = (x - centerX) / 15;

        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
    });

    card.addEventListener("mouseleave",()=>{
        card.style.transform = "rotateX(0) rotateY(0) scale(1)";
    });
});
</script>

</body>
</html>
