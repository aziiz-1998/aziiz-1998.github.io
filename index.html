<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0a0a0f;
    --card-bg: rgba(20, 20, 31, 0.8);
    --fg: #f4f4f5;
    --muted: #71717a;
    --accent: #22b14c;
    --accent-glow: rgba(34, 177, 76, 0.3);
    --border: rgba(255, 255, 255, 0.08);
}

body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
}

.font-display {
    font-family: 'Rajdhani', sans-serif;
}

/* PARTICLE CANVAS */
#particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* BACKGROUND GLOW */
.bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(150px);
    pointer-events: none;
    z-index: 0;
}

.glow-1 {
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(34, 177, 76, 0.08);
}

.glow-2 {
    bottom: -300px;
    right: -200px;
    background: rgba(34, 177, 76, 0.05);
}

/* MAIN CONTENT */
.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeIn 1s ease 0.3s forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 8px;
}

.subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 50px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 40px;
}

@media (max-width: 500px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

/* CARD */
.card {
    position: relative;
    padding: 40px 24px;
    border-radius: 16px;
    text-decoration: none;
    color: white;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    transform-style: preserve-3d;
    display: block;
    text-align: center;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
}

.card:hover::before {
    opacity: 1;
}

.card:hover {
    transform: translateY(-8px);
    border-color: rgba(34, 177, 76, 0.3);
    box-shadow: 
        0 20px 60px -15px rgba(34, 177, 76, 0.4),
        0 0 0 1px rgba(34, 177, 76, 0.2);
}

.card-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px auto;
    background: rgba(34, 177, 76, 0.1);
}

.card-icon svg {
    width: 28px;
    height: 28px;
    display: block;
    flex-shrink: 0;
}

.card h2 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
}

.card span {
    font-size: 0.875rem;
    color: var(--muted);
}

/* SOCIAL SECTION */
.social-section {
    opacity: 0;
    animation: fadeIn 1s ease 0.6s forwards;
}

.social-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
}

.social-links {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.social-link {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-decoration: none;
    transition: all 0.3s ease;
}

.social-link:hover {
    transform: translateY(-4px);
    color: var(--fg);
    border-color: var(--accent);
}

.social-link.youtube:hover {

.social-link.tiktok:hover {

.social-link.instagram:hover {

.social-link svg {

/* FOOTER */

    color: #3f3f46;
    z-index: 1;
}

/* REDUCED MOTION */
@media (prefers-reduced-motion: reduce) {
    .container, .social-section {
        animation: none;
        opacity: 1;
        transform: none;
    }
}

<script>
/* ===== PARTICLE SYSTEM ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particlesArray = [];
const numberOfParticles = 60;
const eps = 0.001;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

class Particle {
    constructor() {
        this.reset();
    }
    
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.max(eps, Math.random() * 2 + 1);
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
    }
    
    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.reset();
        }
    }
    
    draw() {
        const safeSize = Math.max(eps, this.size);
        const safeOpacity = Math.max(0, Math.min(1, this.opacity));
        ctx.fillStyle = `rgba(34, 177, 76, ${safeOpacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, safeSize, 0, Math.PI * 2);
        ctx.fill();
    }
}

function connect() {
    const maxDist = 120;
    for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a + 1; b < particlesArray.length; b++) {
            const dx = particlesArray[a].x - particlesArray[b].x;
            const dy = particlesArray[a].y - particlesArray[b].y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < maxDist) {
                const opacity = Math.max(0, Math.min(1, (1 - distance / maxDist) * 0.15));
                ctx.strokeStyle = `rgba(34, 177, 76, ${opacity})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                ctx.stroke();
            }
        }
    }
}

function init() {
    particlesArray = [];
    for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    particlesArray.forEach(p => {
        p.update();
        p.draw();
    });
    
    connect();
    requestAnimationFrame(animate);
}

init();
animate();

window.addEventListener("resize", () => {
    resizeCanvas();
    init();
});

/* ===== 3D TILT EFFECT ===== */
const cards = document.querySelectorAll(".card");

cards.forEach(card => {
    card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = -(y - centerY) / 12;
        const rotateY = (x - centerX) / 12;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px)`;
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(1000px) rotateX(0) rotateY(0) translateY(0)";
    });
});

/* ===== REDUCED MOTION CHECK ===== */
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cancelAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
