<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aziiz1998 - Ramadan Mubarak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d1a;
            --fg: #f5f0e6;
            --muted: #8b9bb4;
            --accent-gold: #d4a853;
            --accent-gold-light: #f0c96e;
            --accent-purple: #6b4c9a;
            --accent-teal: #2d8a8a;
            --card: rgba(20, 25, 45, 0.85);
            --border: rgba(212, 168, 83, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Amiri', serif;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(107, 76, 154, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(45, 138, 138, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(212, 168, 83, 0.08) 0%, transparent 40%),
                linear-gradient(180deg, #0a0d1a 0%, #12162a 50%, #0a0d1a 100%);
            z-index: 0;
        }

        .islamic-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30L30 0z' fill='none' stroke='%23d4a853' stroke-width='0.5'/%3E%3Cpath d='M30 10L50 30L30 50L10 30L30 10z' fill='none' stroke='%23d4a853' stroke-width='0.5'/%3E%3C/svg%3E");
            background-size: 60px 60px;
            z-index: 0;
        }

        .moon-glow {
            position: fixed;
            top: 5%;
            right: 10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(240, 201, 110, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(30px);
            animation: moonGlow 4s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes moonGlow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        .lantern {
            position: fixed;
            z-index: 1;
            animation: lanternFloat 6s ease-in-out infinite;
        }

        .lantern-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .lantern-2 { top: 20%; right: 8%; animation-delay: -2s; }
        .lantern-3 { top: 60%; left: 3%; animation-delay: -4s; }

        @keyframes lanternFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }

        .lantern svg {
            width: 60px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(212, 168, 83, 0.5));
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .crescent-moon {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
        }

        .crescent-moon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(212, 168, 83, 0.6));
            animation: crescentGlow 3s ease-in-out infinite alternate;
        }

        @keyframes crescentGlow {
            0% { filter: drop-shadow(0 0 20px rgba(212, 168, 83, 0.5)); }
            100% { filter: drop-shadow(0 0 40px rgba(240, 201, 110, 0.8)); }
        }

        .ramadan-greeting {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: var(--accent-gold);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .neon-logo-wrapper {
            position: relative;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .neon-logo {
            position: relative;
            font-family: 'Amiri', serif;
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--accent-gold-light);
            text-shadow: 
                0 0 10px var(--accent-gold),
                0 0 20px var(--accent-gold),
                0 0 40px var(--accent-gold),
                0 0 80px rgba(212, 168, 83, 0.5);
            animation: goldPulse 3s ease-in-out infinite alternate;
            user-select: none;
        }

        @keyframes goldPulse {
            0% {
                text-shadow: 
                    0 0 10px var(--accent-gold),
                    0 0 20px var(--accent-gold),
                    0 0 40px var(--accent-gold),
                    0 0 80px rgba(212, 168, 83, 0.5);
            }
            100% {
                text-shadow: 
                    0 0 15px var(--accent-gold-light),
                    0 0 30px var(--accent-gold),
                    0 0 60px var(--accent-gold),
                    0 0 100px rgba(212, 168, 83, 0.6);
            }
        }

        .neon-logo .letter-glow {
            color: #fff;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px var(--accent-gold-light),
                0 0 40px var(--accent-gold),
                0 0 60px var(--accent-gold);
        }

        .ornament-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .ornament-line .line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .ornament-line .diamond {
            width: 8px;
            height: 8px;
            background: var(--accent-gold);
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 1.5rem;
            animation: fadeInUp 0.8s ease-out 0.3s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 800px;
            width: 100%;
            margin-bottom: 3rem;
        }

        .plugin-card {
            display: block;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease-out backwards;
            text-decoration: none;
            color: inherit;
        }

        .plugin-card:nth-child(1) { animation-delay: 0.4s; }
        .plugin-card:nth-child(2) { animation-delay: 0.6s; }

        .plugin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .plugin-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(212, 168, 83, 0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .plugin-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-gold);
            box-shadow: 
                0 20px 60px rgba(212, 168, 83, 0.1),
                0 0 0 1px rgba(212, 168, 83, 0.2),
                inset 0 0 30px rgba(212, 168, 83, 0.05);
        }

        .plugin-card:hover::before,
        .plugin-card:hover::after {
            opacity: 1;
        }

        .plugin-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.5rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            position: relative;
            transition: transform 0.4s;
            z-index: 1;
        }

        .plugin-card:hover .plugin-icon {
            transform: scale(1.1);
        }

        .theotown .plugin-icon {
            background: linear-gradient(135deg, #1a3a3a 0%, #2d8a8a 100%);
            box-shadow: 0 10px 40px rgba(45, 138, 138, 0.3);
            color: #f0c96e;
        }

        .hok .plugin-icon {
            background: linear-gradient(135deg, #3a1a1a 0%, #8a4545 100%);
            box-shadow: 0 10px 40px rgba(138, 69, 69, 0.3);
            color: #f0c96e;
        }

        .plugin-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            position: relative;
            z-index: 1;
        }

        .plugin-desc {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .plugin-arrow {
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s;
            color: var(--accent-gold);
            position: relative;
            z-index: 1;
        }

        .plugin-card:hover .plugin-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .social-section {
            animation: fadeInUp 0.8s ease-out 0.8s backwards;
        }

        .social-title {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--fg);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .social-btn:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 30px rgba(212, 168, 83, 0.15);
        }

        .social-btn svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
        }

        .social-btn:hover svg {
            transform: scale(1.1);
        }

        .footer {
            position: fixed;
            bottom: 1rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        .footer span {
            color: var(--accent-gold);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 640px) {
            .neon-logo {
                font-size: clamp(2rem, 12vw, 3rem);
            }

            .lantern {
                display: none;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }
            
            .social-links {
                flex-direction: column;
                align-items: stretch;
            }
            
            .social-btn {
                justify-content: center;
            }

            .crescent-moon {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

    <script>
        // Stars Particle System
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        
        let stars = [];
        const starCount = 80;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        class Star {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.baseOpacity = Math.random() * 0.5 + 0.3;
            }
            
            update() {
                this.twinklePhase += this.twinkleSpeed;
            }
            
            draw() {
                const opacity = this.baseOpacity + Math.sin(this.twinklePhase) * 0.3;
                const safeOpacity = Math.max(0, Math.min(1, opacity));
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(240, 201, 110, ${safeOpacity})`;
                ctx.fill();
                
                // Add glow effect for larger stars
                if (this.size > 1.5) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(0.1, this.size * 2), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(212, 168, 83, ${safeOpacity * 0.2})`;
                    ctx.fill();
                }
            }
        }
        
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        if (!prefersReducedMotion) {
            animate();
        }
    </script>
