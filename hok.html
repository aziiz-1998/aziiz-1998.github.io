<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aziiz1998 - Komunitas Honor of Kings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #14141f;
      --fg: #f4f4f5;
      --muted: #71717a;
      --accent: #d4a853;
      --accent-dim: #b8923f;
      --border: #27272a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Rajdhani', sans-serif;
    }

    .bg-gradient {
      background: 
        radial-gradient(ellipse 100% 60% at 50% -10%, rgba(212, 168, 83, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(212, 168, 83, 0.05) 0%, transparent 40%),
        var(--bg);
    }

    .text-gradient {
      background: linear-gradient(135deg, var(--accent) 0%, #f5d78e 50%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glow-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      color: var(--bg);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.125rem;
      padding: 1rem 2.5rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px -10px rgba(212, 168, 83, 0.4);
    }

    .btn-main:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Social Links */
    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .social-link:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      color: var(--fg);
    }

    .social-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .social-link.youtube:hover {
      background: rgba(255, 0, 0, 0.1);
      border-color: #ff0000;
      color: #ff0000;
    }

    .social-link.tiktok:hover {
      background: rgba(0, 0, 0, 0.3);
      border-color: #00f2ea;
      color: #00f2ea;
    }

    .social-link.facebook:hover {
      background: rgba(24, 119, 242, 0.1);
      border-color: #1877f2;
      color: #1877f2;
    }

    .social-link.instagram:hover {
      background: linear-gradient(45deg, rgba(253, 89, 73, 0.15), rgba(214, 36, 159, 0.15));
      border-color: #e1306c;
      color: #e1306c;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .float {
      animation: float 4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(212, 168, 83, 0.2); }
      50% { box-shadow: 0 0 40px rgba(212, 168, 83, 0.4); }
    }

    .pulse-glow {
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .float, .pulse-glow {
        animation: none;
      }
    }
  </style>
</head>
