<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Community Aziiz1998</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-glow: #00ff9d;
            --error-color: #ff4757;
            --yt-red: #FF0000;
            --tt-black: #000000;
            --special-gold: #FFD700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 157, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: 20px; 
        }

        header {
            padding: 3rem 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.8rem;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .header-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .btn-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-header:hover { transform: scale(1.05); }

        .btn-yt { background-color: var(--yt-red); }
        .btn-yt:hover { box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }

        .btn-tt { background-color: var(--tt-black); border: 1px solid #fff; }
        .btn-tt:hover { background-color: #333; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }

        .btn-game { background-color: var(--accent-glow); color: #000; }
        .btn-game:hover { box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }

        /* AFFILIATE SLIDER */
        .affiliate-slider-container {
            width: 100%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 0;
            margin-bottom: 1.5rem;
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            display: none; 
        }
        
        .affiliate-slider-container.loaded { display: block; }

        .affiliate-track {
            display: flex;
            width: max-content;
            animation: scrollSlider 20s linear infinite;
        }

        .affiliate-slider-container:hover .affiliate-track {
            animation-play-state: paused;
        }

        @keyframes scrollSlider {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .affiliate-slide {
            height: 100px;
            margin: 0 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            background: #1a1a1a;
            flex-shrink: 0;
            border: 1px solid var(--card-border);
        }

        .affiliate-slide:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .affiliate-slide img {
            height: 100%;
            width: auto;
            display: block;
            object-fit: cover;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto 1rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border-radius: 30px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--accent-glow); }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .warning-text {
            color: var(--error-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        .status-box {
            text-align: center; padding: 3rem 2rem; background: var(--card-glass);
            border: 1px solid var(--card-border); border-radius: 20px; margin-top: 2rem;
            font-size: 1.1rem; color: var(--text-muted);
        }
        
        .status-box.error { color: var(--error-color); border-color: var(--error-color); background: rgba(255, 71, 87, 0.05); }

        .plugin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card.special-card {
            border: 1px solid var(--special-gold);
            background: linear-gradient(145deg, rgba(255, 215, 0, 0.05), rgba(0, 0, 0, 0.8));
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .card:hover:not(.special-card) {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.1);
        }

        .img-container {
            height: 220px;
            overflow: hidden;
            position: relative;
            background: #111;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: all 0.5s ease;
            filter: grayscale(20%);
        }

        .card:hover .img-container img {
            opacity: 1;
            transform: scale(1.1);
            filter: grayscale(0%);
        }

        .badge-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            z-index: 10;
        }

        .category-tag {
            align-self: flex-start;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }

        .official-badge {
            align-self: flex-end; 
            background: var(--special-gold);
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-body {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-body h2 { font-size: 1.4rem; margin-bottom: 0.25rem; font-weight: 600; }
        
        .creator-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        
        .card.special-card .creator-name { color: var(--special-gold); font-weight: 600; }

        .card-body p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: center;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .btn-download {
            text-decoration: none;
            color: var(--accent-glow);
            border: 1px solid var(--accent-glow);
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
            text-align: center;
            display: block;
            width: 100%;
        }

        .btn-download:hover {
            background: var(--accent-glow);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.4);
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 3rem;
            gap: 10px;
            flex-wrap: wrap;
        }
        .pagination-btn {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .pagination-btn:hover { background: rgba(255,255,255,0.1); }
        .pagination-btn.active { background: var(--accent-glow); color: #000; border-color: var(--accent-glow); }
        .pagination-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* MUSIC PLAYER */
        .music-float-btn {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px;
            background: linear-gradient(145deg, #1e1e1e, #111);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-glow); font-size: 1.5rem; cursor: pointer;
            z-index: 999;
            box-shadow: 0 5px 20px rgba(0, 255, 157, 0.2);
            border: 1px solid var(--accent-glow);
        }
        .music-float-btn:hover { transform: scale(1.1); }
        .music-float-btn.playing { animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 255, 157, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); }
        }
        .visualizer { display: flex; gap: 3px; height: 20px; align-items: flex-end; }
        .bar { width: 3px; background: var(--accent-glow); animation: sound 0.5s infinite alternate; }
        .bar:nth-child(1) { height: 60%; } .bar:nth-child(2) { height: 100%; } .bar:nth-child(3) { height: 40%; }
        @keyframes sound { from { height: 5px; } to { height: 20px; } }

        footer.main-footer {
            text-align: center; padding: 2rem;
            color: var(--text-muted); font-size: 0.8rem;
            border-top: 1px solid var(--card-border); margin-top: 1rem;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .plugin-grid { grid-template-columns: 1fr; }
            .affiliate-slide { height: 70px; }
        }
    </style>
</head>
<body>

    <div id="hidden-youtube-player" style="display: none;"></div>

    <div id="musicBtn" class="music-float-btn" onclick="toggleMusic()">
        <i id="musicIcon" class="fas fa-music"></i>
        <div id="visualizer" class="visualizer" style="display: none;">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>

    <header>
        <h1>Plugin Community Aziiz1998</h1>
        
        <div class="header-buttons">
            <a href="https://youtube.com/@aziiz1998?si=d8s-CUmmjxW93j5h" target="_blank" class="btn-header btn-yt">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="https://www.tiktok.com/@aziiz_1998_?_r=1&_t=ZS-941zZQU8ni8" target="_blank" class="btn-header btn-tt">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://play.google.com/store/apps/details?id=info.flowersoft.theotown.theotown" target="_blank" class="btn-header btn-game">
                <i class="fab fa-google-play"></i> Download Game
            </a>
        </div>

        <div id="affiliate-slider-1" class="affiliate-slider-container">
            <div id="affiliate-track-1" class="affiliate-track"></div>
        </div>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Cari nama plugin, kategori, atau pembuat...">
        </div>

        <p class="warning-text">Dilarang Re upload</p>
    </header>

    <div class="container">
        <div id="plugin-list"></div>
        <div id="pagination-controls" class="pagination-container"></div>
    </div>

    <div id="affiliate-slider-2" class="affiliate-slider-container" style="margin-top: 2rem; margin-bottom: 0; border-top: none;">
        <div id="affiliate-track-2" class="affiliate-track"></div>
    </div>

    <footer class="main-footer">
        &copy; 2023 Plugin Community Aziiz1998. All rights reserved.
    </footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- MUSIC SETUP ---
        let player; let isPlayerReady = false; let isPlaying = false;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('hidden-youtube-player', {
                videoId: '13ARO0HDZsQ', 
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': '13ARO0HDZsQ' },
                events: { 'onReady': (e) => isPlayerReady = true }
            });
        }
        function toggleMusic() {
            if (!isPlayerReady) return;
            let btn = document.getElementById('musicBtn');
            let icon = document.getElementById('musicIcon');
            let viz = document.getElementById('visualizer');
            if (isPlaying) { player.pauseVideo(); icon.style.display="block"; viz.style.display="none"; btn.classList.remove('playing'); }
            else { player.playVideo(); icon.style.display="none"; viz.style.display="flex"; btn.classList.add('playing'); }
            isPlaying = !isPlaying;
        }

        // --- GOOGLE DRIVE IMAGE FIXER (SOLUSI UTAMA) ---
        function fixGDriveLink(url) {
            if (!url) return '';
            // Jika link google drive biasa (view), ubah ke direct link (uc?export=view)
            // Contoh: drive.google.com/file/d/ID_FILE/view -> drive.google.com/uc?export=view&id=ID_FILE
            let match = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match) {
                return `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
            // Jika sudah benar atau link lain, kembalikan apa adanya
            return url;
        }

        // --- DATA SETUP ---
        const PLUGIN_ID = '1bqHZZ_cKQFBVV_3DTfmD6E6Wl4iriykMIHdd-qoPbJU';
        const AFFILIATE_1_ID = '1S-kFFMalmJSddXFzoSUF8vDrmQCugxnISWLkzwZYOO0';
        const AFFILIATE_2_ID = '1dIa9VYNu96CPynDU-fS5UVLW5rnvRorEeOPVsJ-you0';
        const getSheetURL = (id) => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

        let allPluginsData = []; let currentPage = 1; const itemsPerPage = 17; let currentFilteredData = [];

        // --- AFFILIATE LOADER ---
        function loadAffiliate(sheetID, trackID, containerID) {
            fetch(getSheetURL(sheetID)).then(res => res.text()).then(csv => {
                Papa.parse(csv, {
                    header: true,
                    complete: function(results) {
                        if(results.data && results.data.length > 0) {
                            let html = '';
                            results.data.forEach(row => {
                                if(row['Image']) {
                                    // Terapkan fix link juga ke affiliate
                                    const img = fixGDriveLink(row['Image']);
                                    const link = row['Link'] || '#';
                                    html += `<div class="affiliate-slide"><a href="${link}" target="_blank"><img src="${img}" referrerpolicy="no-referrer"></a></div>`;
                                }
                            });
                            if(html) {
                                let track = document.getElementById(trackID);
                                let container = document.getElementById(containerID);
                                track.innerHTML = html + html;
                                container.classList.add('loaded');
                            }
                        }
                    }
                });
            });
        }
        loadAffiliate(AFFILIATE_1_ID, 'affiliate-track-1', 'affiliate-slider-1');
        loadAffiliate(AFFILIATE_2_ID, 'affiliate-track-2', 'affiliate-slider-2');

        // --- PLUGIN RENDERER ---
        function renderCards(data, page) {
            const container = document.getElementById('plugin-list');
            container.innerHTML = ''; 
            if (data.length === 0) { container.innerHTML = `<div class="status-box error">Plugin tidak ditemukan.</div>`; return; }

            const paginatedData = data.slice((page - 1) * itemsPerPage, page * itemsPerPage);
            let htmlContent = '<div class="plugin-grid">';
            
            paginatedData.forEach(row => {
                if (row['Nama Plugin'] && row['Nama Plugin'].trim() !== '') {
                    const nama = row['Nama Plugin'];
                    // PENTING: Gunakan fungsi fixGDriveLink di sini
                    const foto = fixGDriveLink(row['Link Foto']) || 'https://via.placeholder.com/400x200?text=No+Image';
                    const desk = row['Deskripsi'] || 'Tidak ada deskripsi';
                    const down = row['Link Download'] || '#';
                    const pembuat = row['Nama Pembuat'] || 'Anonymous';
                    const kategori = row['Kategori'] || 'Uncategorized';

                    const isSpecial = pembuat.toLowerCase() === 'aziiz1998';
                    const cardClass = isSpecial ? 'card special-card' : 'card';
                    const badgeHTML = isSpecial ? '<div class="official-badge"><i class="fas fa-crown"></i> OFFICIAL</div>' : '';

                    htmlContent += `
                        <article class="${cardClass}">
                            <div class="img-container">
                                <img src="${foto}" alt="${nama}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/400x200?text=Error+Load'">
                                <div class="badge-overlay">
                                    <div class="category-tag">${kategori}</div>
                                    ${badgeHTML}
                                </div>
                            </div>
                            <div class="card-body">
                                <h2>${nama}</h2>
                                <div class="creator-name">Dibuat oleh: ${pembuat}</div>
                                <p>${desk}</p>
                                <div class="card-footer">
                                    <a href="${down}" class="btn-download" target="_blank">GET PLUGIN</a>
                                </div>
                            </div>
                        </article>
                    `;
                }
            });

            htmlContent += '</div>';
            container.innerHTML = htmlContent;
        }

        function renderPagination(totalItems) {
            const pc = document.getElementById('pagination-controls');
            const tp = Math.ceil(totalItems / itemsPerPage);
            if (tp <= 1) { pc.innerHTML = ''; return; }
            let html = `<button class="pagination-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> Prev</button>`;
            let sp = Math.max(1, currentPage - 2);
            let ep = Math.min(tp, currentPage + 2);
            if (sp > 1) { html += `<button class="pagination-btn" onclick="changePage(1)">1</button>`; if (sp > 2) html += `<span style="color: #fff;">...</span>`; }
            for (let i = sp; i <= ep; i++) { html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`; }
            if (ep < tp) { if (ep < tp - 1) html += `<span style="color: #fff;">...</span>`; html += `<button class="pagination-btn" onclick="changePage(${tp})">${tp}</button>`; }
            html += `<button class="pagination-btn" onclick="changePage(${currentPage + 1})" ${currentPage === tp ? 'disabled' : ''}>Next <i class="fas fa-chevron-right"></i></button>`;
            pc.innerHTML = html;
        }

        function changePage(pageNumber) {
            currentPage = pageNumber;
            renderCards(currentFilteredData, currentPage);
            renderPagination(currentFilteredData.length);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            const st = e.target.value.toLowerCase();
            currentFilteredData = st ? allPluginsData.filter(row => 
                (row['Nama Plugin'] || '').toLowerCase().includes(st) || 
                (row['Deskripsi'] || '').toLowerCase().includes(st) || 
                (row['Nama Pembuat'] || '').toLowerCase().includes(st) || 
                (row['Kategori'] || '').toLowerCase().includes(st)
            ) : allPluginsData;
            currentPage = 1;
            renderCards(currentFilteredData, currentPage);
            renderPagination(currentFilteredData.length);
        });

        fetch(getSheetURL(PLUGIN_ID))
            .then(response => response.text())
            .then(csvText => {
                Papa.parse(csvText, {
                    header: true, skipEmptyLines: true,
                    complete: function(results) {
                        allPluginsData = results.data;
                        currentFilteredData = allPluginsData;
                        renderCards(currentFilteredData, currentPage);
                        renderPagination(currentFilteredData.length);
                    }
                });
            });
    </script>
</body>
</html>
