<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Community Aziiz1998</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-glow: #00ff9d;
            --error-color: #ff4757;
            --yt-red: #FF0000;
            --tt-black: #000000;
            --special-gold: #FFD700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 157, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            padding-bottom: 20px; 
        }

        header {
            padding: 3rem 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.8rem;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .header-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .btn-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-header:hover { transform: scale(1.05); }

        .btn-yt { background-color: var(--yt-red); }
        .btn-yt:hover { box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }

        .btn-tt { background-color: var(--tt-black); border: 1px solid #fff; }
        .btn-tt:hover { background-color: #333; box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }

        .btn-game { background-color: var(--accent-glow); color: #000; }
        .btn-game:hover { box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }

        /* SEARCH */
        .search-container { max-width: 500px; margin: 0 auto 1rem; position: relative; }
        .search-input { width: 100%; padding: 15px 20px 15px 50px; border-radius: 30px; background: var(--card-glass); border: 1px solid var(--card-border); color: var(--text-main); font-size: 1rem; outline: none; }
        .search-input::placeholder { color: var(--text-muted); } .search-input:focus { border-color: var(--accent-glow); }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .warning-text { color: var(--error-color); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.5rem; font-size: 0.9rem; margin-bottom: 2rem; }

        /* AFFILIATE SLIDER */
        .affiliate-section { max-width: 1300px; margin: 0 auto 2.5rem; padding: 0 2rem; position: relative; display: none; }
        .affiliate-section.loaded { display: block; }
        .affiliate-container { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: #151515; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .affiliate-track { display: flex; transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
        .affiliate-slide { width: 100%; flex: 0 0 auto; height: 350px; position: relative; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .affiliate-slide img { width: 100%; height: 100%; display: block; object-fit: contain; background-color: #fff; transition: transform 0.3s ease; }
        .affiliate-slide:hover img { transform: scale(1.02); }
        .affiliate-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .affiliate-arrow:hover { background: var(--accent-glow); color: #000; box-shadow: 0 0 20px var(--accent-glow); border-color: var(--accent-glow); }
        .arrow-left { left: 15px; }
        .arrow-right { right: 15px; }
        .affiliate-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; padding: 5px 15px; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); border-radius: 30px; }
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; cursor: pointer; transition: all 0.3s; }
        .dot.active { background: var(--accent-glow); box-shadow: 0 0 8px var(--accent-glow); transform: scale(1.3); }

        /* TIKTOK SECTION */
        .tiktok-section { max-width: 1300px; margin: 0 auto 2rem; padding: 0 2rem; }
        .tiktok-wrapper { display: flex; justify-content: center; width: 100%; }
        .tiktok-grid { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scroll-snap-type: x mandatory; scroll-behavior: smooth; margin: 0 auto; }
        .tiktok-grid::-webkit-scrollbar { height: 4px; } 
        .tiktok-grid::-webkit-scrollbar-track { background: transparent; } 
        .tiktok-grid::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .tiktok-card { flex: 0 0 auto; width: 325px; height: 720px; background: transparent; border: none; border-radius: 15px; overflow: hidden; scroll-snap-align: center; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tiktok-embed { width: 100%; height: 100%; border: none; display: block; border-radius: 15px; overflow: hidden; }

        /* CONTAINER */
        .container { max-width: 1300px; margin: 0 auto; padding: 0 2rem 2rem; }
        .plugin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2rem; }
        .card { background: var(--card-glass); backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; transition: all 0.4s ease; opacity: 0; animation: fadeIn 0.5s forwards; display: flex; flex-direction: column; position: relative; }
        .card.special-card { border: 1px solid var(--special-gold); background: linear-gradient(145deg, rgba(255, 215, 0, 0.05), rgba(0, 0, 0, 0.8)); box-shadow: 0 0 15px rgba(255, 215, 0, 0.15); }
        @keyframes fadeIn { to { opacity: 1; } }
        .card:hover:not(.special-card) { transform: translateY(-10px); border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 0 30px rgba(0, 255, 157, 0.1); }

        .img-container { height: 220px; overflow: hidden; position: relative; background: #111; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: all 0.5s ease; filter: grayscale(20%); }
        .card:hover .img-container img { opacity: 1; transform: scale(1.1); filter: grayscale(0%); }
        
        /* Style untuk gambar error */
        .img-container img.broken {
            object-fit: contain;
            background: #222;
            width: 80%; height: auto;
        }

        .badge-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; }
        .category-tag { align-self: flex-start; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .official-badge { align-self: flex-end; background: var(--special-gold); color: #000; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .card-body { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .card-body h2 { font-size: 1.4rem; margin-bottom: 0.25rem; font-weight: 600; }
        .creator-name { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }
        .card.special-card .creator-name { color: var(--special-gold); font-weight: 600; }
        .card-body p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; flex-grow: 1; }
        .card-footer { display: flex; justify-content: center; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-download { text-decoration: none; color: var(--accent-glow); border: 1px solid var(--accent-glow); padding: 12px 30px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; transition: all 0.3s ease; background: transparent; text-align: center; display: block; width: 100%; }
        .btn-download:hover { background: var(--accent-glow); color: #000; box-shadow: 0 0 15px rgba(0, 255, 157, 0.4); }

        /* PAGINATION */
        .pagination-container { display: flex; justify-content: center; align-items: center; margin-top: 3rem; gap: 10px; flex-wrap: wrap; }
        .pagination-btn { background: var(--card-glass); border: 1px solid var(--card-border); color: var(--text-main); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .pagination-btn:hover { background: rgba(255,255,255,0.1); }
        .pagination-btn.active { background: var(--accent-glow); color: #000; border-color: var(--accent-glow); }
        .pagination-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* MUSIC PLAYER */
        .music-float-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: linear-gradient(145deg, #1e1e1e, #111); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent-glow); font-size: 1.5rem; cursor: pointer; z-index: 999; box-shadow: 0 5px 20px rgba(0, 255, 157, 0.2); border: 1px solid var(--accent-glow); }
        .music-float-btn:hover { transform: scale(1.1); }
        .music-float-btn.playing { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 255, 157, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); } }
        .visualizer { display: flex; gap: 3px; height: 20px; align-items: flex-end; }
        .bar { width: 3px; background: var(--accent-glow); animation: sound 0.5s infinite alternate; }
        .bar:nth-child(1) { height: 60%; } .bar:nth-child(2) { height: 100%; } .bar:nth-child(3) { height: 40%; }
        @keyframes sound { from { height: 5px; } to { height: 20px; } }

        footer.main-footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--card-border); margin-top: 1rem; }

        /* RESPONSIVE */
        @media (max-width: 768px) { 
            header h1 { font-size: 2rem; } 
            .plugin-grid { grid-template-columns: 1fr; } 
            .affiliate-section { padding: 0 10px; }
            .affiliate-slide { height: 250px; }
            .affiliate-arrow { width: 35px; height: 35px; font-size: 14px; }
            .affiliate-dots { bottom: 10px; padding: 4px 10px; gap: 8px; }
            .tiktok-section { padding: 0 5px; } 
            .tiktok-card { width: 325px; height: 700px; box-shadow: none; } 
        }
    </style>
</head>
<body>

    <div id="hidden-youtube-player" style="display: none;"></div>

    <div id="musicBtn" class="music-float-btn" onclick="toggleMusic()">
        <i id="musicIcon" class="fas fa-music"></i>
        <div id="visualizer" class="visualizer" style="display: none;"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
    </div>

    <header>
        <h1>Plugin Community Aziiz1998</h1>
        <div class="header-buttons">
            <a href="https://youtube.com/@aziiz1998?si=d8s-CUmmjxW93j5h" target="_blank" class="btn-header btn-yt"><i class="fab fa-youtube"></i> YouTube</a>
            <a href="https://www.tiktok.com/@aziiz_1998_?_r=1&_t=ZS-941zZQU8ni8" target="_blank" class="btn-header btn-tt"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="https://play.google.com/store/apps/details?id=info.flowersoft.theotown.theotown" target="_blank" class="btn-header btn-game"><i class="fab fa-google-play"></i> Download Game</a>
        </div>

        <!-- AFFILIATE 1 -->
        <div id="aff-section-1" class="affiliate-section">
            <div class="affiliate-container">
                <div class="affiliate-arrow arrow-left" onclick="slideAffiliate(1, -1)"><i class="fas fa-chevron-left"></i></div>
                <div id="aff-track-1" class="affiliate-track"></div>
                <div class="affiliate-arrow arrow-right" onclick="slideAffiliate(1, 1)"><i class="fas fa-chevron-right"></i></div>
                <div id="aff-dots-1" class="affiliate-dots"></div>
            </div>
        </div>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Cari nama plugin, kategori, atau pembuat...">
        </div>
        <p class="warning-text">Dilarang Re upload</p>
    </header>

    <!-- TIKTOK SECTION -->
    <div class="tiktok-section">
        <div class="tiktok-wrapper">
            <div id="tiktok-container" class="tiktok-grid">
                 <div id="tiktok-debug" style="padding: 20px; text-align: center; color: var(--text-muted);">Memuat data video...</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="plugin-list"></div>
        <div id="pagination-controls" class="pagination-container"></div>
    </div>

    <!-- AFFILIATE 2 -->
    <div id="aff-section-2" class="affiliate-section" style="margin-top: 2rem;">
        <div class="affiliate-container" style="border-top: none;">
            <div class="affiliate-arrow arrow-left" onclick="slideAffiliate(2, -1)"><i class="fas fa-chevron-left"></i></div>
            <div id="aff-track-2" class="affiliate-track"></div>
            <div class="affiliate-arrow arrow-right" onclick="slideAffiliate(2, 1)"><i class="fas fa-chevron-right"></i></div>
            <div id="aff-dots-2" class="affiliate-dots"></div>
        </div>
    </div>

    <footer class="main-footer">&copy; 2023 Plugin Community Aziiz1998. All rights reserved.</footer>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- MUSIC SETUP ---
        let player; let isPlayerReady = false; let isPlaying = false;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('hidden-youtube-player', { videoId: '13ARO0HDZsQ', playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': '13ARO0HDZsQ' }, events: { 'onReady': (e) => isPlayerReady = true } });
        }
        function toggleMusic() { if (!isPlayerReady) return; let btn = document.getElementById('musicBtn'); let icon = document.getElementById('musicIcon'); let viz = document.getElementById('visualizer'); if (isPlaying) { player.pauseVideo(); icon.style.display="block"; viz.style.display="none"; btn.classList.remove('playing'); } else { player.playVideo(); icon.style.display="none"; viz.style.display="flex"; btn.classList.add('playing'); } isPlaying = !isPlaying; }

        // --- SUPER LINK FIXER (Solve ImgBB & Drive Issues) ---
        function fixImageLink(url) {
            if (!url) return '';
            url = url.trim();

            // 1. FIX jika user paste KODE HTML <img src="...">
            if (url.includes('<img')) {
                const match = url.match(/src=["'](.*?)["']/);
                if (match && match[1]) {
                    url = match[1];
                }
            }

            // 2. FIX Google Drive
            let matchDrive = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (matchDrive) { return `https://drive.google.com/thumbnail?id=${matchDrive[1]}&sz=w1000`; }

            // 3. FIX ImgBB (Jika user pakai link pendek ibb.co)
            // Ubah ibb.co/xxxx -> i.ibb.co/xxxx.jpg (Tebakan cerdas, 90% berhasil)
            if (url.includes('ibb.co/') && !url.includes('i.ibb.co')) {
                return url.replace('ibb.co/', 'i.ibb.co/') + '.jpg';
            }

            return url;
        }

        // --- DATA ID ---
        const PLUGIN_ID = '1bqHZZ_cKQFBVV_3DTfmD6E6Wl4iriykMIHdd-qoPbJU';
        const AFFILIATE_1_ID = '1S-kFFMalmJSddXFzoSUF8vDrmQCugxnISWLkzwZYOO0';
        const AFFILIATE_2_ID = '1dIa9VYNu96CPynDU-fS5UVLW5rnvRorEeOPVsJ-you0';
        const TIKTOK_ID = '1JKTE9aseusXZ3nCOW4tIp-Rn5ngdS0quB2BBm1xvgNM';
        const getSheetURL = (id) => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

        let allPluginsData = []; let currentPage = 1; const itemsPerPage = 17; let currentFilteredData = [];

        // --- TIKTOK LOADER ---
        fetch(getSheetURL(TIKTOK_ID)).then(res => res.text()).then(csv => { Papa.parse(csv, { header: true, complete: function(results) { const container = document.getElementById('tiktok-container'); const debugDiv = document.getElementById('tiktok-debug'); let foundAny = false; if(results.data && results.data.length > 0) { results.data.forEach((row) => { let link = row['Link'] || row['link'] || row['LINK']; if(link) { foundAny = true; if(debugDiv) debugDiv.style.display = 'none'; const card = document.createElement('div'); card.className = 'tiktok-card'; let videoId = ''; let idMatch = link.match(/video\/(\d+)/); if(idMatch) videoId = idMatch[1]; if(videoId) { card.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${videoId}" class="tiktok-embed" allowfullscreen="true" allow="fullscreen" loading="lazy"></iframe>`; } else { card.innerHTML = `<blockquote class="tiktok-embed" cite="${link}" data-video-id="" style="max-width: 605px;min-width: 325px;" ><section><a target="_blank" href="${link}">Tonton di TikTok</a></section></blockquote>`; } container.appendChild(card); } }); if(!foundAny) { debugDiv.innerHTML = "<span style='color:var(--error_color)'>Kolom 'Link' tidak ditemukan.</span>"; debugDiv.style.display = 'block'; } if (container.querySelector('blockquote')) { var script = document.createElement('script'); script.src = 'https://www.tiktok.com/embed.js'; script.async = true; document.body.appendChild(script); } } } }); });

        // --- AFFILIATE CAROUSEL LOGIC ---
        const affiliateStates = {}; 

        function initAffiliateSlider(sheetID, trackID, sectionID, dotsID) {
            fetch(getSheetURL(sheetID)).then(res => res.text()).then(csv => {
                Papa.parse(csv, {
                    header: true,
                    complete: function(results) {
                        if(results.data && results.data.length > 0) {
                            const track = document.getElementById(trackID);
                            const section = document.getElementById(sectionID);
                            const dotsContainer = document.getElementById(dotsID);
                            let html = '';
                            let dotsHtml = '';
                            let count = 0;
                            
                            results.data.forEach(row => {
                                if(row['Image']) { 
                                    const img = fixImageLink(row['Image']); 
                                    const link = row['Link'] || '#'; 

                                    html += `
                                        <div class="affiliate-slide">
                                            <a href="${link}" target="_blank">
                                                <img 
                                                    src="${img}" 
                                                    alt="Gambar Affiliate" 
                                                    referrerpolicy="no-referrer" 
                                                    onerror="this.onerror=null; this.src='https://via.placeholder.com/600x350/333/fff?text=Link+Salah';"
                                                >
                                            </a>
                                        </div>`; 
                                    
                                    const activeClass = count === 0 ? 'active' : '';
                                    dotsHtml += `<div class="dot ${activeClass}" onclick="jumpToSlide('${trackID}', ${count})"></div>`;
                                    count++;
                                }
                            });

                            if(html) {
                                track.innerHTML = html;
                                dotsContainer.innerHTML = dotsHtml;
                                section.classList.add('loaded');
                                
                                affiliateStates[trackID] = {
                                    index: 0, autoSlide: null, track: track, items: track.children, dots: dotsContainer.children
                                };

                                startAutoSlide(trackID);
                                track.parentElement.addEventListener('mouseenter', () => stopAutoSlide(trackID));
                                track.parentElement.addEventListener('mouseleave', () => startAutoSlide(trackID));
                            }
                        }
                    }
                });
            });
        }

        function updateDots(trackID) {
            const state = affiliateStates[trackID];
            if (!state || !state.items.length) return;
            const slideWidth = state.items[0].offsetWidth;
            const currentIndex = Math.round(state.index / slideWidth);
            
            for (let i = 0; i < state.dots.length; i++) { state.dots[i].classList.remove('active'); }
            if (state.dots[currentIndex]) { state.dots[currentIndex].classList.add('active'); }
        }

        function jumpToSlide(trackID, index) {
            const state = affiliateStates[trackID];
            if (!state) return;
            const slideWidth = state.items[0].offsetWidth;
            state.index = index * slideWidth;
            state.track.style.transform = `translateX(-${state.index}px)`;
            updateDots(trackID);
        }

        function slideAffiliate(id, direction) {
            const trackID = `aff-track-${id}`;
            const state = affiliateStates[trackID];
            if (!state || state.items.length === 0) return;

            const slideWidth = state.items[0].offsetWidth;
            const maxScroll = slideWidth * (state.items.length - 1);

            state.index += direction * slideWidth;

            if (state.index > maxScroll) state.index = 0;
            if (state.index < 0) state.index = maxScroll;

            state.track.style.transform = `translateX(-${state.index}px)`;
            updateDots(trackID);
        }

        function startAutoSlide(trackID) {
            stopAutoSlide(trackID); 
            const idNum = trackID.split('-')[2]; 
            affiliateStates[trackID].autoSlide = setInterval(() => { slideAffiliate(idNum, 1); }, 4000);
        }

        function stopAutoSlide(trackID) {
            if (affiliateStates[trackID] && affiliateStates[trackID].autoSlide) {
                clearInterval(affiliateStates[trackID].autoSlide);
            }
        }

        initAffiliateSlider(AFFILIATE_1_ID, 'aff-track-1', 'aff-section-1', 'aff-dots-1');
        initAffiliateSlider(AFFILIATE_2_ID, 'aff-track-2', 'aff-section-2', 'aff-dots-2');

        // --- PLUGIN RENDERER ---
        function renderCards(data, page) {
            const container = document.getElementById('plugin-list');
            container.innerHTML = ''; if (data.length === 0) { container.innerHTML = `<div class="status-box error">Plugin tidak ditemukan.</div>`; return; }
            const paginatedData = data.slice((page - 1) * itemsPerPage, page * itemsPerPage);
            let htmlContent = '<div class="plugin-grid">';
            paginatedData.forEach(row => {
                if (row['Nama Plugin'] && row['Nama Plugin'].trim() !== '') {
                    const nama = row['Nama Plugin'];
                    const foto = fixImageLink(row['Link Foto']) || 'https://via.placeholder.com/400x200?text=No+Image';
                    const desk = row['Deskripsi'] || 'Tidak ada deskripsi';
                    const down = row['Link Download'] || '#';
                    const pembuat = row['Nama Pembuat'] || 'Anonymous';
                    const kategori = row['Kategori'] || 'Uncategorized';
                    const isSpecial = pembuat.toLowerCase() === 'aziiz1998';
                    const cardClass = isSpecial ? 'card special-card' : 'card';
                    const badgeHTML = isSpecial ? '<div class="official-badge"><i class="fas fa-crown"></i> OFFICIAL</div>' : '';
                    htmlContent += `
                        <article class="${cardClass}">
                            <div class="img-container">
                                <img 
                                    src="${foto}" 
                                    alt="${nama}" 
                                    referrerpolicy="no-referrer" 
                                    onerror="this.onerror=null; this.src='https://via.placeholder.com/400x200/333/fff?text=Gambar+Error'; this.classList.add('broken');"
                                >
                                <div class="badge-overlay"><div class="category-tag">${kategori}</div>${badgeHTML}</div>
                            </div>
                            <div class="card-body">
                                <h2>${nama}</h2><div class="creator-name">Dibuat oleh: ${pembuat}</div><p>${desk}</p>
                                <div class="card-footer"><a href="${down}" class="btn-download" target="_blank">GET PLUGIN</a></div>
                            </div>
                        </article>
                    `;
                }
            });
            htmlContent += '</div>'; container.innerHTML = htmlContent;
        }

        function renderPagination(totalItems) { const pc = document.getElementById('pagination-controls'); const tp = Math.ceil(totalItems / itemsPerPage); if (tp <= 1) { pc.innerHTML = ''; return; } let html = `<button class="pagination-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> Prev</button>`; let sp = Math.max(1, currentPage - 2); let ep = Math.min(tp, currentPage + 2); if (sp > 1) { html += `<button class="pagination-btn" onclick="changePage(1)">1</button>`; if (sp > 2) html += `<span style="color: #fff;">...</span>`; } for (let i = sp; i <= ep; i++) { html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`; } if (ep < tp) { if (ep < tp - 1) html += `<span style="color: #fff;">...</span>`; html += `<button class="pagination-btn" onclick="changePage(${tp})">${tp}</button>`; } html += `<button class="pagination-btn" onclick="changePage(${currentPage + 1})" ${currentPage === tp ? 'disabled' : ''}>Next <i class="fas fa-chevron-right"></i></button>`; pc.innerHTML = html; }
        function changePage(pageNumber) { currentPage = pageNumber; renderCards(currentFilteredData, currentPage); renderPagination(currentFilteredData.length); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        document.getElementById('searchInput').addEventListener('keyup', function(e) { const st = e.target.value.toLowerCase(); currentFilteredData = st ? allPluginsData.filter(row => (row['Nama Plugin'] || '').toLowerCase().includes(st) || (row['Deskripsi'] || '').toLowerCase().includes(st) || (row['Nama Pembuat'] || '').toLowerCase().includes(st) || (row['Kategori'] || '').toLowerCase().includes(st)) : allPluginsData; currentPage = 1; renderCards(currentFilteredData, currentPage); renderPagination(currentFilteredData.length); });

        fetch(getSheetURL(PLUGIN_ID))
            .then(response => response.text())
            .then(csvText => { Papa.parse(csvText, { header: true, skipEmptyLines: true, complete: function(results) { allPluginsData = results.data; currentFilteredData = allPluginsData; renderCards(currentFilteredData, currentPage); renderPagination(currentFilteredData.length); } }); });
    </script>
</body>
</html>
